# ============================================================
# OdontoSystem API - Configuración principal
# ============================================================

server.port=${PORT:8080}
spring.application.name=odontosystem-api

# ------------------------------------------------------------
# Base de datos PostgreSQL (Supabase)
# Reemplaza los valores por los de tu proyecto en supabase.com
# Project Settings -> Database -> Connection string (URI / JDBC)
# ------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:aws-0-us-east-1.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USER:postgres.xxxxxxxxxxxx}
spring.datasource.password=${DB_PASSWORD:tu_password_aqui}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------------------------
# Flyway (migraciones de esquema - ver src/main/resources/db/migration)
# ------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# ------------------------------------------------------------
# JWT
# ------------------------------------------------------------
jwt.secret=${JWT_SECRET:CAMBIA_ESTA_CLAVE_POR_UNA_DE_AL_MENOS_256_BITS_ANTES_DE_PRODUCCION}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ------------------------------------------------------------
# CORS (permite que el cliente Android / Postman consuman la API)
# ------------------------------------------------------------
app.cors.allowed-origins=${CORS_ORIGINS:*}

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging.level.org.springframework.security=INFO
logging.level.com.odontosystem=DEBUG
