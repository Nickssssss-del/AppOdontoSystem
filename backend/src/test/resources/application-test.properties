# Perfil de pruebas: usa las mismas variables de entorno que el perfil
# principal, para poder correr `mvn test` apuntando a tu instancia de
# Supabase de desarrollo (nunca a la de producción).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
jwt.secret=${JWT_SECRET:test_secret_key_only_for_automated_tests_1234567890}
jwt.expiration-ms=3600000
app.cors.allowed-origins=*
